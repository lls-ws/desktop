services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - /home/lls/.jellyfin/config:/config
      - /home/lls/.jellyfin/cache:/cache
      - /home/shared:/media
    ports:
      - 8096:8096
    restart: unless-stopped
