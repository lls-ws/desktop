network:
  version: 2
  renderer: networkd
  ethernets:
    enp8s0: # <-- Substitua pelo nome correto da sua interface de rede
      dhcp4: false
      dhcp6: true
      addresses:
        - 192.168.0.2/24 # <-- Defina a máscara de sub-rede apropriada (ex: /24)
      routes:
        - to: default
          via: 192.168.0.1 # <-- Substitua pelo IP correto do seu Gateway IPv4
      nameservers:
        addresses:
          - 1.1.1.1
          - 8.8.8.8
