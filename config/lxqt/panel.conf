[General]
__userfile__=true
iconTheme=
panels=panel1

[mainmenu]
alignment=Left
customFont=true
customFontSize=32
filterShowMaxItems=10
menu_file=/home/lls/.config/lxqt/lxqt-lls.menu
ownIcon=true
showText=false
type=mainmenu

[panel1]
alignment=0
animation-duration=50
background-color=@Variant(\0\0\0\x43\x1\xff\xff\0\0\0\0\0\0\0\0)
background-image=
desktop=0
font-color=@Variant(\0\0\0\x43\0\xff\xff\0\0\0\0\0\0\0\0)
hidable=true
hide-on-overlap=false
iconSize=80
lineCount=1
lockPanel=false
opacity=100
panelSize=80
plugins=mainmenu, taskbar, statusnotifier2, tray, volume2, worldclock2
position=Left
reserve-space=true
show-delay=0
visible-margin=true
width=100
width-percent=true

[statusnotifier2]
alignment=Right
attentionPeriod=5
autoHideList=onboard
hideList=, blueman, nm-tray
reverseOrder=false
type=statusnotifier

[taskbar]
alignment=Left
autoRotate=true
buttonHeight=100
buttonStyle=Icon
buttonWidth=200
closeOnMiddleClick=true
excludedList=
groupingEnabled=false
iconByClass=false
raiseOnCurrentDesktop=false
showDesktopNum=0
showGroupOnHover=true
showOnlyCurrentScreenTasks=false
showOnlyMinimizedTasks=false
showOnlyOneDesktopTasks=false
type=taskbar
ungroupedNextToExisting=false
wheelDeltaThreshold=300
wheelEventsAction=0

[tray]
alignment=Right
type=tray

[volume2]
alignment=Right
type=volume

[worldclock2]
alignment=Right
autoRotate=false
customFormat="'<b>'HH:mm:ss'</b><br /><font size=\"-2\">'ddd, d MMM yyyy'<br />'TT'</font>'"
dateFormatType=custom
dateLongNames=false
datePadDay=false
datePosition=below
dateShowDoW=false
dateShowYear=false
defaultTimeZone=
formatType=short-timeonly
showDate=false
showTimezone=false
showTooltip=false
showWeekNumber=true
timeAMPM=false
timePadHour=false
timeShowSeconds=false
timeZoneWheel=true
timeZones\size=0
timezoneFormatType=iana
timezonePosition=below
type=worldclock
useAdvancedManualFormat=false
